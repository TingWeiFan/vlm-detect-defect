<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Inference latency comparison</title>
  <desc id="desc">Bar chart comparing transformers and vLLM latency for full-image and four-tile inference on an RTX 3080.</desc>
  <rect width="920" height="500" rx="18" fill="#ffffff"/>
  <text x="460" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Inference latency</text>
  <text x="460" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">RTX 3080 · lower is better</text>

  <line x1="100" y1="400" x2="860" y2="400" stroke="#374151" stroke-width="1.5"/>
  <line x1="100" y1="100" x2="100" y2="400" stroke="#374151" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
    <line x1="100" y1="340" x2="860" y2="340" stroke="#e5e7eb"/><text x="86" y="344" text-anchor="end">300</text>
    <line x1="100" y1="280" x2="860" y2="280" stroke="#e5e7eb"/><text x="86" y="284" text-anchor="end">600</text>
    <line x1="100" y1="220" x2="860" y2="220" stroke="#e5e7eb"/><text x="86" y="224" text-anchor="end">900</text>
    <line x1="100" y1="160" x2="860" y2="160" stroke="#e5e7eb"/><text x="86" y="164" text-anchor="end">1200</text>
    <line x1="100" y1="100" x2="860" y2="100" stroke="#e5e7eb"/><text x="86" y="104" text-anchor="end">1500</text>
    <text x="86" y="404" text-anchor="end">0</text>
    <text transform="translate(31 250) rotate(-90)" text-anchor="middle">Latency (ms / image)</text>
  </g>

  <rect x="165" y="310.2" width="72" height="89.8" rx="5" fill="#7c3aed"/>
  <rect x="247" y="374" width="72" height="26" rx="5" fill="#10b981"/>
  <text x="201" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">449 ms</text>
  <text x="283" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">130 ms</text>
  <text x="242" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#374151">Full image</text>

  <rect x="565" y="140" width="72" height="260" rx="5" fill="#7c3aed"/>
  <rect x="647" y="257.6" width="72" height="142.4" rx="5" fill="#10b981"/>
  <text x="601" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">~1300 ms</text>
  <text x="683" y="249" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">712 ms</text>
  <text x="642" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#374151">4 tiles</text>

  <g font-family="Arial, sans-serif" font-size="14" fill="#374151">
    <rect x="282" y="461" width="18" height="12" rx="2" fill="#7c3aed"/><text x="308" y="472">transformers</text>
    <rect x="492" y="461" width="18" height="12" rx="2" fill="#10b981"/><text x="518" y="472">vLLM</text>
  </g>
</svg>
