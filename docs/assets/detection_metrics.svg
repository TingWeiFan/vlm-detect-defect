<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Detection metrics on the KolektorSDD2 test set</title>
  <desc id="desc">Grouped bar chart comparing full-image and four-tile inference on AP, precision, and recall.</desc>
  <rect width="920" height="500" rx="18" fill="#ffffff"/>
  <text x="460" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Detection quality on KolektorSDD2</text>
  <text x="460" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Official test set · 1,004 images · 110 defective</text>

  <line x1="100" y1="400" x2="860" y2="400" stroke="#374151" stroke-width="1.5"/>
  <line x1="100" y1="100" x2="100" y2="400" stroke="#374151" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
    <line x1="100" y1="340" x2="860" y2="340" stroke="#e5e7eb"/><text x="86" y="344" text-anchor="end">0.2</text>
    <line x1="100" y1="280" x2="860" y2="280" stroke="#e5e7eb"/><text x="86" y="284" text-anchor="end">0.4</text>
    <line x1="100" y1="220" x2="860" y2="220" stroke="#e5e7eb"/><text x="86" y="224" text-anchor="end">0.6</text>
    <line x1="100" y1="160" x2="860" y2="160" stroke="#e5e7eb"/><text x="86" y="164" text-anchor="end">0.8</text>
    <line x1="100" y1="100" x2="860" y2="100" stroke="#e5e7eb"/><text x="86" y="104" text-anchor="end">1.0</text>
    <text x="86" y="404" text-anchor="end">0.0</text>
  </g>

  <!-- AP -->
  <rect x="165" y="107.8" width="72" height="292.2" rx="5" fill="#2563eb"/>
  <rect x="247" y="108.1" width="72" height="291.9" rx="5" fill="#f59e0b"/>
  <text x="201" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">0.974</text>
  <text x="283" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">0.973</text>
  <text x="242" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#374151">AP</text>

  <!-- Precision -->
  <rect x="405" y="119.5" width="72" height="280.5" rx="5" fill="#2563eb"/>
  <rect x="487" y="159.1" width="72" height="240.9" rx="5" fill="#f59e0b"/>
  <text x="441" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">0.935</text>
  <text x="523" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">0.803</text>
  <text x="482" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#374151">Precision</text>

  <!-- Recall -->
  <rect x="645" y="124.6" width="72" height="275.4" rx="5" fill="#2563eb"/>
  <rect x="727" y="110.8" width="72" height="289.2" rx="5" fill="#f59e0b"/>
  <text x="681" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">0.918</text>
  <text x="763" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">0.964</text>
  <text x="722" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#374151">Recall</text>

  <g font-family="Arial, sans-serif" font-size="14" fill="#374151">
    <rect x="300" y="461" width="18" height="12" rx="2" fill="#2563eb"/><text x="326" y="472">Full image</text>
    <rect x="492" y="461" width="18" height="12" rx="2" fill="#f59e0b"/><text x="518" y="472">4 tiles</text>
  </g>
</svg>
